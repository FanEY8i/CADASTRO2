<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <p>Faça o Login Para Continuar</p>
        <input type="text" id="nome" placeholder="nome":>
        <br>
   
        <input type="email" id="e-mail" placeholder="e-mail:">
        <br>

        <input type="number" id="CPF" placeholder="CPF:">
        <br>

        <input type="number" id="telefone" placeholder="telefone:">
        <br>

        <input type="password" id="senha" placeholder="senha:">
        <br>

        <input type="password" id="confirme sua senha" placeholder="confirme seua senha:">
        <br>

        <button id="entrar">Entrar</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
